# Dependabot: solo actualizaciones de SEGURIDAD de las acciones de GitHub que usa el CI (el sitio no tiene
# package.json). open-pull-requests-limit 0 desactiva los PRs por cada versión nueva.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
