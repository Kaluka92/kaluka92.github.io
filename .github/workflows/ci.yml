name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  enlaces:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node .github/scripts/revisar-enlaces.mjs
      - run: node --test test/*.test.mjs
      - run: python3 .github/scripts/idiomas/generar.py --revisar
